<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pengguna &mdash; DOOMINIKS STORE Owner</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="page-loader" id="page-loader"><div class="loader-ring"></div></div>
<div id="toast-container"></div>

<!-- USER DETAIL MODAL -->
<div class="modal-overlay" id="modal-user-detail">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <span class="modal-title">Detail Pengguna</span>
      <button class="modal-close" onclick="closeModal('modal-user-detail')">&times;</button>
    </div>
    <div id="user-detail-body"></div>
  </div>
</div>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <div class="brand">DOOMINIKS <span>STORE</span></div>
      <div class="role">★ Owner Panel</div>
    </div>
    <div class="sidebar-section-title">Menu Utama</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><span class="nav-icon">⬡</span>Dashboard</a>
      <a href="products.html"><span class="nav-icon">◈</span>Produk</a>
      <a href="orders.html"><span class="nav-icon">◷</span>Pesanan</a>
    </nav>
    <div class="sidebar-section-title" style="margin-top:8px;">Data</div>
    <nav class="sidebar-nav">
      <a href="users.html" class="active"><span class="nav-icon">◎</span>Pengguna</a>
      <a href="leaderboard.html"><span class="nav-icon">◉</span>Leaderboard</a>
    </nav>
    <div class="sidebar-section-title" style="margin-top:8px;">Sistem</div>
    <nav class="sidebar-nav">
      <a href="settings.html"><span class="nav-icon">⊙</span>Pengaturan</a>
      <a href="../../index.html"><span class="nav-icon">◁</span>Ke Toko</a>
    </nav>
    <div style="margin-top:auto;padding-top:24px;border-top:1px solid var(--border);">
      <button class="btn btn-ghost btn-sm btn-full" onclick="signOut()" style="color:var(--red);">→ Logout</button>
    </div>
  </aside>

  <main class="admin-content">
    <div class="admin-page-title">Pengguna</div>
    <div class="admin-page-sub">Semua akun yang terdaftar di DOOMINIKS STORE</div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
      <div style="position:relative;flex:1;min-width:200px;">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);">⌕</span>
        <input class="form-input" id="user-search" placeholder="Cari nama atau email..." oninput="renderUsers()" style="padding-left:38px;" />
      </div>
      <div class="stat-card" style="padding:12px 20px;flex-shrink:0;">
        <div style="font-size:13px;color:var(--text-secondary);">Total Pengguna</div>
        <div style="font-family:var(--font-display);font-size:20px;font-weight:800;" id="user-count">-</div>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Pengguna</th>
            <th>Email</th>
            <th>Total Belanja</th>
            <th>Total Order</th>
            <th>Bergabung</th>
            <th>Login Terakhir</th>
            <th>Aksi</th>
          </tr></thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../../js/firebase-config.js"></script>
<script src="../../js/app.js"></script>
<script>
let allUsers = [];
let lbMap = {};

function requireOwner(user) {
  if (!user || !isOwner(user.uid)) {
    toast("Akses ditolak.", "error");
    setTimeout(() => window.location.href = "../../index.html", 1500);
    return false;
  }
  return true;
}

async function loadUsers() {
  try {
    const [usersSnap, lbSnap] = await Promise.all([
      db.collection("users").orderBy("createdAt", "desc").get(),
      db.collection("leaderboard").get()
    ]);
    lbMap = {};
    lbSnap.docs.forEach(d => { lbMap[d.id] = d.data(); });
    allUsers = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById("user-count").textContent = allUsers.length;
    renderUsers();
  } catch (e) {
    toast("Gagal memuat: " + e.message, "error");
  }
}

function renderUsers() {
  const q = document.getElementById("user-search").value.toLowerCase();
  const filtered = allUsers.filter(u =>
    !q || (u.displayName||"").toLowerCase().includes(q) || (u.email||"").toLowerCase().includes(q)
  );
  const tbody = document.getElementById("users-tbody");
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">▲</div><h4>Tidak ada pengguna</h4></div></td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(u => {
    const lb = lbMap[u.id] || {};
    return `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="lb-avatar">${u.photoURL ? `<img src="${u.photoURL}" alt="">` : (u.displayName||u.email||"?")[0].toUpperCase()}</div>
          <div style="font-weight:600;font-size:14px;">${u.displayName || "-"}</div>
        </div>
      </td>
      <td style="font-size:13px;color:var(--text-secondary);">${u.email||"-"}</td>
      <td style="font-weight:700;color:var(--gold);">${formatIDR(lb.totalSpent || 0)}</td>
      <td style="font-size:13px;">${lb.orderCount || 0}</td>
      <td style="font-size:12px;color:var(--text-muted);">${formatDate(u.createdAt)}</td>
      <td style="font-size:12px;color:var(--text-muted);">${formatDate(u.lastLogin)}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="viewUser('${u.id}')">☰ Detail</button>
      </td>
    </tr>`;
  }).join("");
}

async function viewUser(uid) {
  const u = allUsers.find(x => x.id === uid);
  if (!u) return;
  const lb = lbMap[uid] || {};
  // Load user orders
  let ordersHtml = "<div style='color:var(--text-muted);font-size:13px;'>Memuat pesanan...</div>";
  document.getElementById("user-detail-body").innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
      <div class="lb-avatar" style="width:52px;height:52px;font-size:20px;">${u.photoURL ? `<img src="${u.photoURL}" alt="">` : (u.displayName||"?")[0].toUpperCase()}</div>
      <div>
        <div style="font-family:var(--font-display);font-size:18px;font-weight:700;">${u.displayName||"-"}</div>
        <div style="font-size:13px;color:var(--text-secondary);">${u.email||"-"}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
      <div style="background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;">
        <div style="font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;margin-bottom:4px;">Total Belanja</div>
        <div style="font-size:20px;font-weight:800;color:var(--gold);font-family:var(--font-display);">${formatIDR(lb.totalSpent||0)}</div>
      </div>
      <div style="background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;">
        <div style="font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;margin-bottom:4px;">Total Order</div>
        <div style="font-size:20px;font-weight:800;font-family:var(--font-display);">${lb.orderCount||0}</div>
      </div>
    </div>
    <div style="font-family:var(--font-display);font-size:14px;font-weight:700;margin-bottom:12px;">Riwayat Pesanan Terakhir</div>
    <div id="user-orders-list">${ordersHtml}</div>
  `;
  openModal("modal-user-detail");
  // Load orders
  try {
    const snap = await db.collection("orders").where("userId","==",uid).orderBy("createdAt","desc").limit(5).get();
    const statusMap = { pending:"badge-pending", processing:"badge-processing", success:"badge-success", failed:"badge-failed" };
    const statusLbl = { pending:"Pending", processing:"Diproses", success:"Berhasil", failed:"Gagal" };
    if (snap.empty) {
      document.getElementById("user-orders-list").innerHTML = `<div style="color:var(--text-muted);font-size:13px;">Belum ada pesanan.</div>`;
      return;
    }
    document.getElementById("user-orders-list").innerHTML = snap.docs.map(d => {
      const o = d.data();
      return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--gold);">${o.orderId}</div>
          <div style="font-size:12px;color:var(--text-secondary);">${o.productName} &mdash; ${o.itemName}</div>
          <div style="font-size:11px;color:var(--text-muted);">${formatDate(o.createdAt)}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;font-size:13px;">${formatIDR(o.total)}</div>
          <span class="badge ${statusMap[o.status]||'badge-pending'}" style="font-size:11px;">${statusLbl[o.status]||o.status}</span>
        </div>
      </div>`;
    }).join("");
  } catch(e) {
    document.getElementById("user-orders-list").innerHTML = `<div style="color:var(--red);font-size:13px;">Gagal memuat pesanan.</div>`;
  }
}

function onAuthReady(user) {
  hideLoader();
  if (!requireOwner(user)) return;
  loadUsers();
}
</script>
</body>
</html>
