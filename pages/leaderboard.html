<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Leaderboard &mdash; DOOMINIKS STORE</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    .podium { display:flex; align-items:flex-end; justify-content:center; gap:16px; margin-bottom:48px; }
    .podium-item { text-align:center; display:flex; flex-direction:column; align-items:center; }
    .podium-avatar { border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; border:3px solid; }
    .podium-platform { border-radius:12px 12px 0 0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:900; color:var(--bg-void); }
    .podium-name { font-weight:700; font-size:14px; margin-top:10px; }
    .podium-total { font-size:13px; color:var(--gold); font-weight:600; }
    .my-rank { background:var(--gold-glow); border:1px solid rgba(201,168,76,0.3); border-radius:var(--radius); padding:14px 16px; margin-bottom:24px; display:flex; align-items:center; gap:14px; }
  </style>
</head>
<body>
<div class="page-loader" id="page-loader"><div class="loader-ring"></div></div>
<div id="toast-container"></div>

<div class="modal-overlay" id="modal-login">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header"><span class="modal-title">Masuk</span><button class="modal-close" onclick="closeModal('modal-login')">&times;</button></div>
    <button class="btn btn-secondary btn-full btn-lg" onclick="handleGoogleLogin()">Lanjutkan dengan Google</button>
  </div>
</div>

<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo"><div class="logo-mark">D</div>DOOMINIKS <span>STORE</span></a>
    <div class="nav-links">
      <a href="../index.html">Beranda</a>
      <a href="catalog.html">Katalog</a>
      <a href="orders.html">Pesanan</a>
      <a href="leaderboard.html" class="active">Leaderboard</a>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary btn-sm" id="btn-login" onclick="openModal('modal-login')" style="display:none;">Masuk</button>
      <div class="nav-actions" id="user-menu" style="display:none;">
        <div style="display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;">
          <span class="review-avatar" id="nav-avatar" style="width:24px;height:24px;font-size:11px;"></span>
          <span id="nav-username" style="font-size:14px;"></span>
          <a href="owner/dashboard.html" id="nav-admin-link" style="display:none;color:var(--gold);font-size:13px;">★</a>
          <button onclick="signOut()" style="background:none;color:var(--text-muted);font-size:13px;">→</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container" style="padding-top:48px;padding-bottom:80px;max-width:800px;">
  <div style="text-align:center;margin-bottom:48px;">
    <h1 style="font-family:var(--font-display);font-size:36px;font-weight:800;margin-bottom:8px;">★ Leaderboard</h1>
    <p style="color:var(--text-secondary);">Top pembeli bulan ini &mdash; belanja lebih untuk naik peringkat</p>
  </div>

  <!-- Podium top 3 -->
  <div class="podium" id="podium"></div>

  <!-- My rank -->
  <div id="my-rank-section" style="display:none;"></div>

  <!-- Full list -->
  <div class="card" style="padding:0;overflow:hidden;">
    <div id="lb-full-list">
      <div style="text-align:center;padding:48px;"><div class="loader-ring" style="margin:0 auto;"></div></div>
    </div>
  </div>
</div>

<footer style="background:var(--bg-deep);border-top:1px solid var(--border);padding:24px 0;">
  <div class="container" style="text-align:center;color:var(--text-muted);font-size:13px;">&copy; 2025 DOOMINIKS STORE</div>
</footer>

<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let lbData = [];

async function loadLeaderboard() {
  try {
    const snap = await db.collection("leaderboard").orderBy("totalSpent", "desc").limit(50).get();
    lbData = snap.docs.map((d, i) => ({ rank: i + 1, uid: d.id, ...d.data() }));
    renderPodium(lbData.slice(0, 3));
    renderFullList(lbData);
    if (currentUser) showMyRank(lbData);
  } catch (e) {
    document.getElementById("lb-full-list").innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px;">Gagal memuat data.</div>`;
  }
}

function renderPodium(top) {
  const podium = document.getElementById("podium");
  if (!top.length) { podium.style.display = "none"; return; }
  const configs = [
    { idx: 1, order: 2, size: 72, height: 100, color: "#C9A84C", border: "#C9A84C" },
    { idx: 0, order: 1, size: 80, height: 120, color: "#E8C97A", border: "#E8C97A" },
    { idx: 2, order: 3, size: 64, height: 80, color: "#CD7F32", border: "#CD7F32" },
  ];
  podium.innerHTML = configs.map(c => {
    const user = top[c.idx];
    if (!user) return "";
    return `
      <div class="podium-item" style="order:${c.order};">
        <div class="podium-avatar" style="width:${c.size}px;height:${c.size}px;font-size:${c.size*0.3}px;border-color:${c.border};background:var(--bg-card);">
          ${user.photoURL ? `<img src="${user.photoURL}" alt="" style="width:100%;height:100%;object-fit:cover;">` : (user.displayName||"?")[0].toUpperCase()}
        </div>
        <div class="podium-name">${user.displayName || "Anonim"}</div>
        <div class="podium-total">${formatIDR(user.totalSpent||0)}</div>
        <div class="podium-platform" style="background:${c.color};width:${c.size+16}px;height:${c.height}px;margin-top:12px;">${c.idx === 0 ? "1" : c.idx === 1 ? "2" : "3"}</div>
      </div>
    `;
  }).join("");
}

function renderFullList(data) {
  const el = document.getElementById("lb-full-list");
  if (!data.length) { el.innerHTML = `<div class="empty-state"><h4>Belum ada data</h4></div>`; return; }
  const rankClass = r => r === 1 ? "gold-rank" : r === 2 ? "silver-rank" : r === 3 ? "bronze-rank" : "other-rank";
  el.innerHTML = data.map(u => `
    <div class="lb-row" style="border-bottom:1px solid var(--border);${currentUser && u.uid === currentUser.uid ? 'background:var(--gold-glow);' : ''}">
      <div class="lb-rank ${rankClass(u.rank)}">${u.rank}</div>
      <div class="lb-avatar">${u.photoURL ? `<img src="${u.photoURL}" alt="">` : (u.displayName||"?")[0].toUpperCase()}</div>
      <div>
        <div class="lb-name">${u.displayName || "Anonim"}${currentUser && u.uid === currentUser.uid ? ' <span style="font-size:11px;color:var(--gold);">(Kamu)</span>' : ""}</div>
        <div class="lb-orders">${u.orderCount || 0} pesanan</div>
      </div>
      <div style="text-align:right;">
        <div class="lb-total">${formatIDR(u.totalSpent || 0)}</div>
      </div>
    </div>
  `).join("");
}

function showMyRank(data) {
  const me = data.find(u => u.uid === currentUser.uid);
  const section = document.getElementById("my-rank-section");
  if (!me) { section.style.display = "none"; return; }
  section.style.display = "block";
  section.innerHTML = `
    <div class="my-rank">
      <div class="lb-rank ${me.rank <= 3 ? ['gold-rank','silver-rank','bronze-rank'][me.rank-1] : 'other-rank'}">${me.rank}</div>
      <div style="flex:1;">
        <div style="font-size:13px;color:var(--text-secondary);">Peringkatmu saat ini</div>
        <div style="font-weight:700;font-size:15px;">${me.displayName || "Kamu"}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:18px;font-weight:800;color:var(--gold);font-family:var(--font-display);">${formatIDR(me.totalSpent||0)}</div>
        <div style="font-size:12px;color:var(--text-muted);">${me.orderCount||0} pesanan</div>
      </div>
    </div>
  `;
}

async function handleGoogleLogin() {
  try { await signInWithGoogle(); closeModal("modal-login"); loadLeaderboard(); } catch(e) {}
}

function onAuthReady(user) {
  hideLoader();
  loadLeaderboard();
}
</script>
</body>
</html>
